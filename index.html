<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nopal en la nieve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
  :root { --mapw: min(1000px, 94vw, calc(56vh * 220 / 170)); }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; background: #fff; color: #000; }
  header { padding: clamp(16px, 4vh, 40px) 16px 0; text-align: center; }
  h1 img { display: block; margin: 0 auto; width: min(820px, 92vw); height: auto; }
  main { padding: clamp(6px, 1.5vh, 16px) 0 24px; text-align: center; }
  #stage { display: inline-block; transition: opacity .2s linear; line-height: 0; }
  #stage.out { opacity: 0; }
  #stage { position: relative; }

  /* password box that opens when the coyote steps on the spiral */
  #pw, #pk { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; line-height: normal; }
  #pw[hidden], #pk[hidden] { display: none; }
  #pk-keys { width: min(520px, 84vw); height: auto; touch-action: none; user-select: none; -webkit-user-select: none;
             -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; cursor: pointer; display: block; }
  .pk-box { padding: 16px; }
  .pw-box { background: #fff; border: 4px solid #000; box-shadow: 8px 8px 0 #000;
            padding: 18px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #pw-label { width: min(246px, 60vw); height: auto; }
  .pw-row { display: flex; }
  #pw-input { font: 20px/1 'Silkscreen', ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em;
              width: min(10.5em, 52vw); padding: 10px 12px; border: 3px solid #000; border-right: 0; border-radius: 0;
              background: #fff; color: #000; outline: none; -webkit-appearance: none; appearance: none; }
  #pw button, #pk button { font: 22px/1 ui-monospace, Menlo, Consolas, monospace; font-weight: 700; border: 3px solid #000;
                   border-radius: 0; cursor: pointer; padding: 0; width: 46px; }
  #pw-go { background: #000; color: #fff; font-size: 28px; }
  #pw-close, #pk-close { position: absolute; top: -4px; right: -4px; transform: translate(50%, -50%); width: 34px; height: 34px;
              background: #fff; color: #000; font-size: 22px; }
  .pw-inner { position: relative; }
  .pw-box.no { animation: no .32s steps(2) 1; }
  @keyframes no { 0%, 50% { transform: translateX(-8px); } 25%, 75% { transform: translateX(8px); } 100% { transform: none; } }
  #world, #strip {
    width: var(--mapw); height: auto;
    background: #fff; outline: none;
  }
  #strip-wrap { text-align: center; line-height: 0; padding-top: clamp(8px, 2vh, 20px); }
  #keys-wrap { line-height: 0; margin-top: clamp(10px, 2vh, 20px); }
  #keys { width: calc(var(--mapw) * 46 / 220); height: auto; background: #fff; }
  @media (pointer: coarse) {            /* phones and tablets: the arrow pad is big and pressable */
    #keys { width: min(300px, 74vw); touch-action: none; user-select: none;
            -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  }
</style>
</head>

<script>
/* ---------- grid + drawing helpers (1 cell = 1 "pixel" of the art) ---------- */
const W = 220, H = 170, C = 4;                 // world size in cells, canvas px per cell
const cv = document.getElementById('world'), wctx = cv.getContext('2d');
let ctx = wctx;                                  // helpers draw on whichever canvas is current
const stage = document.getElementById('stage');
cv.width = W * C; cv.height = H * C;

function parse(s) {
  const rows = s.trim().split('\n'), pts = [];
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] === '#') pts.push([x, y]); });
  return { pts, w: Math.max(...rows.map(r => r.length)), h: rows.length };
}
function put(g, x, y, k = 1, col = '#000', flip = false) {
  ctx.fillStyle = col;
  for (const [px, py] of g.pts) {
    const qx = flip ? g.w - 1 - px : px;
    ctx.fillRect(Math.round(x + qx * k) * C, Math.round(y + py * k) * C, k * C, k * C);
  }
}
function rect(x, y, w, h, col = '#000') { ctx.fillStyle = col; ctx.fillRect(x * C, y * C, w * C, h * C); }

/* ---------- art ---------- */
const HOLES = [[5, 6], [9, 7], [13, 6], [2, 3]];                 // body dots + eye
const noHoles = g => ({ ...g, pts: g.pts.filter(([x, y]) => !HOLES.some(h => h[0] === x && h[1] === y)) });

...#.#................
...###................
..####................
######................
.#####................
...###############....
...################...
...#################..
...###############.##.`;

...##..##...##..##..##
...##..##...##..##...#`), parse(BODY + `
...###.###..###.###.##
....##.##....##.##..##
....##..##...##..##.##
...##...##..##...##..#`)].map(noHoles);

.##....##.
.##.......`, `
.##....##.
.......##.`];

###....###
##########
##.####.##

.###..###.

.#####.##.
.########.` + l));

  if (scene === 'musica') {                            // walk up against the piano to play it; step back to re-arm
    const pcx = p.x + p.w / 2;
    if (hitY && dy < -0.2 && pkArmed && pcx > 82 && pcx < 138 && p.y < 96) return openPk();
    if (p.y > 100) pkArmed = true;
  }
  if (scene === 'musica' && !unlocked) {               // step onto the spiral's centre to be asked; step off to re-arm
    const d = Math.hypot(p.x + p.w / 2 - SPIRAL.x, p.y + CH / 2 - SPIRAL.y);
    if (d < 7 && pwArmed && moving) return openPw();
    if (d > 20) pwArmed = true;
  }
  if (target && !held && ((hitX && hitY) || (hitX && Math.abs(dy) < 0.05) || (hitY && Math.abs(dx) < 0.05))) target = null;
}

function draw(t) {
  rect(0, 0, W, H, '#fff');
  SCENES[scene].draw(t);
  const f = p.walk ? Math.floor(p.walk / 0.14) % 2 : 0;
  const g = p.dir === 'side' ? COYOTE[f] : p.dir === 'down' ? FRONT[f] : BACK[f];
  halo(g, Math.round(p.x), Math.round(p.y), p.dir === 'side' && p.face > 0);   // white halo so she reads over labels
}

/* ---------- strip under the title: she runs in, stops in the middle, howls, runs on ---------- */
const SW = 220, SH = 26, GROUND = 23;
const sv = document.getElementById('strip'), sctx = sv.getContext('2d');
sv.width = SW * C; sv.height = SH * C;

const HOWL_BASE = parse(`
....................
...............#....
..............##....
.............###....
.........#..###.....
.........##.###.....
.........######.....
..........####......
.........#####......
........######......
.......#######......
......########......
.....#########......
.....#########......
....##########......
#...####..####......
##..####..####......
.##.####..####......
..######..#####.....`);
const HOWL_HOLES = [[8, 12], [6, 14], [10, 10], [11, 15]];
function howlGlyph(tailDown, stretch) {
  let pts = HOWL_BASE.pts.filter(([x, y]) => !HOWL_HOLES.some(h => h[0] === x && h[1] === y));
  if (tailDown) pts = pts.filter(([x, y]) => !(x <= 3 && y >= 15 && y <= 17))
                         .concat([[0, 16], [0, 17], [1, 17], [2, 17], [3, 17]]);
  if (stretch) pts = pts.concat([[15, 0], [14, 1]]);
  return { pts, w: HOWL_BASE.w, h: HOWL_BASE.h };
}
const HOWL = [0, 1].map(t => [0, 1].map(s => howlGlyph(t, s)));     // HOWL[tail][stretch]

const FLOWERS = [parse(`
.#.#.
#####
##.##
#####
.#.#.
..#..
.##..
..#..`), parse(`
#.#.#
#####
#####
.###.
..#..
..##.
..#..
..#..`)];
const FLOWER_X = [10, 33, 58, 80, 137, 158, 183, 205];

function halo(g, x, y, flip) {
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) put(g, x + ox, y + oy, 1, '#fff', flip);
  put(g, x, y, 1, '#000', flip);
}
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;
function drawStrip(t) {
  ctx = sctx;
  rect(0, 0, SW, SH, '#fff');
  FLOWER_X.forEach((x, i) => {
    const g = FLOWERS[i % 2];
    put(g, x, GROUND - g.h, 1, '#000', !STILL && Math.floor(t / 0.6 + i * 0.37) % 2 === 1);   // gentle sway
  });
  const u = STILL ? 4 : t % 11, mid = SW / 2 - 10;
  if (u < 3 || (u >= 7 && u < 10)) {                              // running, right to left
    const x = u < 3 ? SW + (mid - SW) * (u / 3) : mid + (-CW - 2 - mid) * ((u - 7) / 3);
    halo(COYOTE[Math.floor(u / 0.14) % 2], Math.round(x), GROUND - CH, false);
  } else if (u < 7) {                                             // sitting in the middle, howling
    const h = u - 3, on = h > 0.4 && h < 3.7 && Math.floor((h - 0.4) / 0.55) % 2 === 0;
    halo(HOWL[Math.floor(h / 0.4) % 2][on ? 1 : 0], mid, GROUND - HOWL_BASE.h, true);
    if (on && Math.floor(h / 0.2) % 2) { rect(mid - 1, GROUND - 19, 2, 1); rect(mid - 4, GROUND - 16, 2, 1); }
  }
  ctx = wctx;
}

/* ---------- instructions as a picture: the four arrow keys, each pressed in turn while she moves ---------- */
const KW = 46, KH = 29;
const kv = document.getElementById('keys'), kctx = kv.getContext('2d');
kv.width = KW * C; kv.height = KH * C;
const ARROW = {
  l: parse(`
..#...
.##...
######
######
.##...
..#...`),
  u: parse(`
..##..
.####.
######
..##..
..##..
..##..`),
  d: parse(`
..##..
..##..
..##..
######
.####.
..##..`),
};
const KEYPOS = { u: [16, 1], l: [1, 14], d: [16, 14], r: [31, 14] };
function key(name, down) {
  const [x, y0] = KEYPOS[name], y = y0 + (down ? 1 : 0), g = ARROW[name === 'r' ? 'l' : name];
  rect(x, y, 14, 12);
  if (!down) rect(x + 2, y + 2, 10, 8, '#fff');
  put(g, x + 4, y + 3, 1, down ? '#fff' : '#000', name === 'r');
}
const PRESS = ['l', 'd', 'r', 'u'];                 // demo: each key dips in turn until a real one is used
let used = false;
function drawKeys(t) {
  ctx = kctx;
  rect(0, 0, KW, KH, '#fff');
  const real = ['l', 'r', 'u', 'd'].filter(on);
  if (real.length) used = true;
  const u = t % (PRESS.length * 1.35), i = Math.floor(u / 1.35), v = u - i * 1.35;
  const demo = !used && !STILL && v > 0.15 && v < 1.15 ? PRESS[i] : null;
  for (const name in KEYPOS) key(name, real.includes(name) || name === demo);
  ctx = wctx;
}

/* touch screens only: holding a drawn key walks her, exactly like the keyboard arrow */
const fingers = new Map();                          // pointerId -> key name
function keyAt(e) {
  const r = kv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * KW, y = (e.clientY - r.top) / r.height * KH;
  let best = null, bd = 1e9;
  for (const name in KEYPOS) {                      // nearest key, so near-misses still count
    const d = Math.hypot(KEYPOS[name][0] + 7 - x, KEYPOS[name][1] + 6 - y);
    if (d < bd) { bd = d; best = name; }
  }
  return best;
}
function syncTouch() { for (const k of ['l', 'r', 'u', 'd']) touch[k] = [...fingers.values()].includes(k); }
function finger(e) {
  if (e.pointerType === 'mouse') return;            // computers stay keyboard-only
  e.preventDefault(); fingers.set(e.pointerId, keyAt(e)); syncTouch();
}
function lift(e) { fingers.delete(e.pointerId); syncTouch(); }
kv.addEventListener('pointerdown', e => { finger(e); try { kv.setPointerCapture(e.pointerId); } catch (_) {} });
kv.addEventListener('pointermove', e => { if (fingers.has(e.pointerId)) finger(e); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => kv.addEventListener(ev, lift));
kv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { fingers.clear(); syncTouch(); });

/* ---------- butterflies: now and then one or two drift across the map; purely decorative ---------- */
const FLY = [parse(`
.#.......#.
..#.....#..
###..#..###
####.#.####
.#########.
.####.####.
###..#..###
##.......##`), parse(`
..#.....#..
...#...#...
...##.##...
...#####...
....###....
...#####...
...##.##...
...#...#...`)];
let flies = [], nextFlight = 3;
function drawFlies(t, dt) {
  if (STILL) return;
  if (!flies.length && t > nextFlight) {
    const dir = Math.random() < 0.5 ? 1 : -1, y = 20 + Math.random() * (H - 60);
    const n = Math.random() < 0.5 ? 1 : 2;
    for (let i = 0; i < n; i++)
      flies.push({ x: dir > 0 ? -14 - i * 22 : W + 3 + i * 22, y: y + i * 12, dir,
                   v: 20 + Math.random() * 8, ph: Math.random() * 6, amp: 5 + Math.random() * 5 });
  }
  for (const f of flies) {
    f.x += f.dir * f.v * dt;
    const y = f.y + Math.sin(t * 2.2 + f.ph) * f.amp + Math.sin(t * 5.1 + f.ph) * 1.5;
    halo(FLY[Math.floor(t / 0.16 + f.ph) % 2], Math.round(f.x), Math.round(y), false);
  }
  const before = flies.length;
  flies = flies.filter(f => f.x > -40 && f.x < W + 40);
  if (before && !flies.length) nextFlight = t + 7 + Math.random() * 12;      // 7-19 s until the next visit
}

/* same rounded look as the title: blur the hard pixels, then snap back to black/white */
function fit() {
  cv.style.filter = sv.style.filter = `blur(${(cv.clientWidth / W * 0.3).toFixed(2)}px) contrast(30)`;
  kv.style.filter = `blur(${(kv.clientWidth / KW * 0.3).toFixed(2)}px) contrast(30)`;
}
const ro = new ResizeObserver(fit); ro.observe(cv); ro.observe(kv); fit();

const start = location.hash.slice(1);                          // e.g. #mercado opens inside
if (SCENES[start] && start !== 'world') { scene = start; p.dir = 'up'; p.w = NW; p.x = W / 2 - NW / 2; p.y = H - 6 - CH - 6; }

/* take keyboard focus straight away, so the arrows work without clicking the map first */
function grab() { if (pwOpen || pkOpen) return; if (!document.hasFocus() || document.activeElement !== cv) { try { window.focus(); cv.focus({ preventScroll: true }); } catch (_) {} } }
grab();
['load', 'pageshow', 'focus'].forEach(ev => addEventListener(ev, grab));
document.addEventListener('visibilitychange', grab);
document.addEventListener('pointermove', grab, { passive: true });     // hovering the page is enough
document.addEventListener('pointerdown', grab);

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!busy && !pwOpen && !pkOpen) step(dt);
  spiralT += dt * (now / 1000 < spinUntil ? 12 : 1);
  draw(now / 1000);
  drawFlies(now / 1000, dt);
  drawStrip(now / 1000);
  drawKeys(now / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
